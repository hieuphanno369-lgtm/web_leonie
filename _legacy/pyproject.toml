[project]
name = "task-tracker"
version = "0.1.0"
description = "CHOOPER — Personal productivity assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "jinja2>=3.1.0",
    "jupyterlab>=4.0.0",
    "kneed>=0.8.0",
    "markdown>=3.6",
    "msal>=1.30.0",
    "nbconvert>=7.0.0",
    "nbformat>=5.9.0",
    "ollama>=0.6.0",
    "pandas>=3.0",
    "plotly>=5.0.0",
    "pmdarima>=2.0.0",
    "prophet>=1.3.0",
    "polars>=0.20.0",
    "pywin32>=311; sys_platform == 'win32'",
    "python-dotenv>=1.0.0",
    "questionary>=2.0.0",
    "requests>=2.32.0",
    "rich>=13.0.0",
    "schedule>=1.2.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.35.0",
    "xgboost>=2.0.0",
    "openpyxl>=3.1.5",
    "numpy>=2.0",
    "scipy>=1.17.1",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "pyarrow>=24.0.0",
    "dask[complete]>=2026.3.0",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.3",
    "ipykernel>=7.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
