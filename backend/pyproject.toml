[project]
name = "leonie-backend"
version = "0.1.0"
description = "Leonie — FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "duckdb>=1.0.0",
    "polars>=0.20.0",
    "openpyxl>=3.1.0",
    "scipy>=1.13.0",
    "pyarrow>=16.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "fastexcel>=0.20.2",
    "httpx>=0.27.0",
    "simple-salesforce>=1.12.9",
    "xlsxwriter>=3.2.9",
    "anthropic>=0.103.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
